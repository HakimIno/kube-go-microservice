version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kube-postgres-dev
    environment:
      POSTGRES_DB: kube
      POSTGRES_USER: kube_user
      POSTGRES_PASSWORD: kube_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-scripts:/docker-entrypoint-initdb.d
    networks:
      - kube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kube_user -d kube"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kube-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # User Service (Development with hot reload)
  user-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.user-service.dev
      cache_from:
        - golang:1.25-alpine
    container_name: kube-user-service-dev
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://kube_user:kube_password@postgres:5432/kube?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - PORT=8081
      - SERVICE_NAME=user-service
      - GO_ENV=development
    volumes:
      # Mount source code for hot reload
      - ../../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kube-network
    restart: unless-stopped
    command: ["go", "run", "./services/user/cmd"]

  # Maps Service (Development with hot reload)
  maps-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.maps-service.dev
      cache_from:
        - golang:1.25-alpine
    container_name: kube-maps-service-dev
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgres://kube_user:kube_password@postgres:5432/kube?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - HERE_API_KEY=WJxd-f213J08HqNIGMgM3dfQaRTwbe02D8unFbc_ge4
      - PORT=8082
      - SERVICE_NAME=maps-service
      - GO_ENV=development
    volumes:
      # Mount source code for hot reload
      - ../../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kube-network
    restart: unless-stopped
    command: ["go", "run", "./services/maps/cmd"]

volumes:
  postgres_data:
  redis_data:

networks:
  kube-network:
    driver: bridge
