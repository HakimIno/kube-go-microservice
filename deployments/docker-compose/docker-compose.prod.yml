version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kube-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-kube}
      POSTGRES_USER: ${DB_USER:-kube_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-scripts:/docker-entrypoint-initdb.d
    networks:
      - kube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kube_user} -d ${DB_NAME:-kube}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kube-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # User Service
  user-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.user-service
      cache_from:
        - golang:1.25-alpine
    container_name: kube-user-service-prod
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-kube_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kube}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8081
      - SERVICE_NAME=user-service
      - GO_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      replicas: 2

  # Maps Service
  maps-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.maps-service
      cache_from:
        - golang:1.25-alpine
    container_name: kube-maps-service-prod
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-kube_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kube}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - HERE_API_KEY=${HERE_API_KEY}
      - PORT=8082
      - SERVICE_NAME=maps-service
      - GO_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      replicas: 2

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kube-network:
    driver: bridge 